[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperlayer"
dynamic = ["version"]
description = "Convert PDF and DOCX into clean, structured Markdown for RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lars Gross" }]
keywords = [
    "pdf",
    "docx",
    "markdown",
    "rag",
    "document-parsing",
    "text-extraction",
    "retrieval",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Filters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Both backends are required so that `pip install paperlayer` works on any
# supported file with no extras to remember. Neither is imported until a
# document of that format is actually parsed.
dependencies = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
bench = ["tiktoken>=0.7.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16,<0.17",
    "tiktoken>=0.7.0",
]

[project.scripts]
paperlayer = "paperlayer.cli:main"

[project.urls]
Homepage = "https://github.com/larsgrosscom/paperlayer"
Repository = "https://github.com/larsgrosscom/paperlayer"
Issues = "https://github.com/larsgrosscom/paperlayer/issues"
Changelog = "https://github.com/larsgrosscom/paperlayer/blob/main/CHANGELOG.md"

# Single source of truth: the version lives in the package and nowhere else.
[tool.hatch.version]
path = "src/paperlayer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlayer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error",
    # pdfminer emits these on perfectly readable files.
    "ignore::DeprecationWarning:pdfminer.*",
]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Assigning a lambda default in a dataclass field is the idiom here.
    "RUF009",
    # Long messages in raise statements read better inline.
    "EM101",
    # Ligatures, exotic spaces and typographic dashes are the subject matter of
    # _text.py, not a mistake; flagging them as "ambiguous" is noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
# Ruff also formats Python blocks embedded in Markdown. The README aligns the
# trailing comments in its block-model snippet into a column on purpose, which
# the formatter would collapse, so documentation is left alone.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/paperlayer"]
strict = true
warn_unreachable = true
# pdfplumber and python-docx ship no type information.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdfminer.*", "docx.*", "lxml.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["paperlayer"]
branch = true
